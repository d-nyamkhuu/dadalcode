name: Bug report
description: Report an application or lesson problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the problem name, expected result, and actual result. Do not include private code or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Desktop browser, OS, and release/commit
    validations:
      required: true
